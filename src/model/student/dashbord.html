<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Étudiant</title>
  <link rel="stylesheet" href="dashboard.css">

</head>
<body>

  <div class="dashboard">
   


    <!-- SIDEBAR -->
    <aside class="sidebar">
      <h2 class="logo">E-Learning</h2>

      <nav>
        <a href="#" class="active">🏠 Dashboard</a>
        <a href="#">📚 Mes cours</a>
        <a href="#">📝 Mes résultats</a>
        <a href="#">👤 Profil</a>
        <a href="#">💳 Paiements</a>
        <a href="login.html" class="logout">🚪 Déconnexion</a>
       
      </nav>
    </aside>

    <!-- CONTENU PRINCIPAL -->
    <main class="main-content">

      <!-- HEADER -->
      <header class="header">
        <h1>Bienvenue, Étudiant 👋</h1>
        <p>Voici votre espace personnel</p>
      </header>

      <!-- STATISTIQUES -->
      <section class="stats">
        <div class="card">
          <h3>📚 Cours</h3>
          <p>6</p>
        </div>

        <div class="card">
          <h3>✅ Progression</h3>
          <p>75%</p>
        </div>

        <div class="card">
          <h3>🏆 Certificats</h3>
          <p>2</p>
        </div>
      </section>

      <!-- LISTE DES COURS -->
      <section class="courses">
        <h2>Mes Cours</h2>

        <div class="course-list">

          <div class="course-card">
            <h4>HTML & CSS</h4>
            <p>Progression : 80%</p>
            <button>Continuer</button>
          </div>

          <div class="course-card">
            <h4>JavaScript</h4>
            <p>Progression : 45%</p>
            <button>Continuer</button>
          </div>

          <div class="course-card">
            <h4>React JS</h4>
            <p>Progression : 20%</p>
            <button>Continuer</button>
          </div>

        </div>
      </section>

    </main>

  </div>
  




</body>
</html>
